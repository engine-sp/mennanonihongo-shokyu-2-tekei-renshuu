<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to JSON Converter - Japanese Verbs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">動詞資料轉換器 (CSV to JSON)</h1>
            <p class="text-gray-600">將 CSV 格式的日文動詞資料轉換為特定的 JSON 結構</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Input Section -->
            <div class="bg-white rounded-xl shadow-md p-6 flex flex-col h-[600px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">CSV 輸入</h2>
                    <button id="clearInput" class="text-sm text-red-500 hover:text-red-700 transition-colors">清除內容</button>
                </div>
                <textarea id="csvInput" class="flex-grow p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none font-mono text-sm custom-scrollbar" placeholder="請在此貼上 CSV 內容..."></textarea>
            </div>

            <!-- Output Section -->
            <div class="bg-white rounded-xl shadow-md p-6 flex flex-col h-[600px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">JSON 輸出</h2>
                    <div class="space-x-2">
                        <button id="copyBtn" class="px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors text-sm">複製</button>
                        <button id="downloadBtn" class="px-3 py-1 bg-green-500 text-white rounded hover:bg-green-600 transition-colors text-sm font-medium">下載 JSON</button>
                    </div>
                </div>
                <div id="jsonOutput" class="flex-grow p-4 bg-gray-50 border border-gray-300 rounded-lg overflow-auto font-mono text-sm custom-scrollbar whitespace-pre"></div>
            </div>
        </div>

        <div class="mt-8 flex justify-center">
            <button id="convertBtn" class="px-8 py-3 bg-blue-600 text-white text-lg font-bold rounded-lg shadow-lg hover:bg-blue-700 transform hover:-translate-y-1 transition-all active:scale-95">
                立即轉換
            </button>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-8 right-8 px-6 py-3 bg-gray-800 text-white rounded-lg shadow-2xl transform translate-y-24 opacity-0 transition-all duration-300 flex items-center space-x-2">
            <span id="toastMsg"></span>
        </div>
    </div>

    <script>
        const csvInput = document.getElementById('csvInput');
        const jsonOutput = document.getElementById('jsonOutput');
        const convertBtn = document.getElementById('convertBtn');
        const clearInput = document.getElementById('clearInput');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // 預設內容（根據您的 data.csv）
        const defaultCsv = `連用形,ます形,て形規則,課本,課編號

料理し,料理します,E,初級1,9

覚え,覚えます,E,初級2,17
忘れ,忘れます,E,初級2,17
無くし,無くします,E,初級2,17
払い,払います,D,初級2,17
返し,返します,E,初級2,17
出掛け,出掛けます,E,初級2,17
脫ぎ,脫ぎます,B,初級2,17
心配し,心配します,E,初級2,17
殘業し,殘業します,E,初級2,17
出張し,出張します,E,初級2,17
出來,出來ます,E,初級2,18
洗い,洗います,D,初級2,18
彈き,彈きます,A,初級2,18
歌い,歌います,D,初級2,18
集め,集めます,E,初級2,18
捨て,捨てます,E,初級2,18
換え,換えます,E,初級2,18
運転し,運転します,E,初級2,18
予約し,予約します,E,初級2,18`;

        csvInput.value = defaultCsv;

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        function convert() {
            const rawText = csvInput.value.trim();
            if (!rawText) {
                showToast('❌ 請先輸入 CSV 內容');
                return;
            }

            const lines = rawText.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            // 檢查欄位是否存在
            const mapping = {
                '連用形': '連用形',
                'ます形': 'ます形',
                'て形規則': '規則',
                '課本': '課本',
                '課編號': '課編號'
            };

            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const values = lines[i].split(',').map(v => v.trim());
                const entry = {};
                
                headers.forEach((header, index) => {
                    const jsonKey = mapping[header] || header;
                    let value = values[index];
                    
                    // 課編號轉數字
                    if (jsonKey === '課編號') {
                        const num = parseInt(value, 10);
                        value = isNaN(num) ? value : num;
                    }
                    
                    entry[jsonKey] = value;
                });
                result.push(entry);
            }

            jsonOutput.textContent = JSON.stringify(result, null, '\t');
            showToast('✅ 轉換成功！');
        }

        convertBtn.addEventListener('click', convert);

        clearInput.addEventListener('click', () => {
            csvInput.value = '';
            jsonOutput.textContent = '';
            showToast('🧹 已清除');
        });

        copyBtn.addEventListener('click', () => {
            const content = jsonOutput.textContent;
            if (!content) return;
            navigator.clipboard.writeText(content).then(() => {
                showToast('📋 已複製到剪貼簿');
            });
        });

        downloadBtn.addEventListener('click', () => {
            const content = jsonOutput.textContent;
            if (!content) return;
            const blob = new Blob([content], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'verbs_data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('💾 檔案下載中...');
        });

        // 頁面加載後自動執行一次轉換
        convert();
    </script>
</body>
</html>
