<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文て形練習工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Welcome Page -->
        <div id="welcome-page" class="page active bg-white shadow-xl rounded-2xl p-8 md:p-12 text-center">
            <h1 class="text-4xl font-extrabold text-blue-600 mb-6">日文て形練習工具</h1>
            <div class="text-left bg-blue-50 border-l-4 border-blue-500 p-4 mb-8">
                <p class="text-slate-700 leading-relaxed">
                    本頁依照「大家的日本語」課程進度，以不超過課本範圍的動詞為準，隨機選取10題，並請使用者回答該動詞的て形的練習小工具。
                </p>
            </div>
            
            <h2 class="text-2xl font-bold mb-4 text-slate-800">請選擇練習範圍</h2>
            
            <div class="mb-8">
                <select id="range-select" class="w-full md:w-80 px-4 py-3 rounded-lg border-2 border-slate-200 focus:border-blue-500 focus:outline-none transition-colors">
                    <option value="1-all">初級1全部課程</option>
                    <option value="2-13">初級1全部到初級2第13課</option>
                    <option value="2-14" selected>初級1全部到初級2第14課</option>
                    <option value="2-15">初級1全部到初級2第15課</option>
                    <option value="2-16">初級1全部到初級2第16課</option>
                    <option value="2-17">初級1全部到初級2第17課</option>
                    <option value="2-18">初級1全部到初級2第18課</option>
                </select>
            </div>
            
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full text-xl shadow-lg transform transition hover:scale-105 active:scale-95">
                開始練習
            </button>
        </div>

        <!-- Question Page -->
        <div id="question-page" class="page bg-white shadow-xl rounded-2xl p-8">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <span id="question-count" class="text-lg font-medium text-slate-500">第 1 題 / 共 10 題</span>
                <button id="abort-btn" class="text-red-500 hover:text-red-700 font-medium">中止作答</button>
            </div>

            <div class="text-center mb-10">
                <h3 id="question-verb" class="text-5xl font-black text-slate-800 mb-4 tracking-wider">---</h3>
                <p class="text-slate-500">請選擇正確的 て 形規則</p>
            </div>

            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                <!-- Options will be injected here -->
            </div>

            <div class="flex flex-col items-center space-y-6">
                <button id="submit-btn" disabled class="w-full md:w-64 bg-blue-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl text-lg shadow-md transition-all">
                    確定答案
                </button>

                <div id="feedback-area" class="hidden w-full p-6 rounded-xl text-center">
                    <p id="feedback-text" class="text-xl font-bold mb-4"></p>
                    <button id="next-btn" class="text-blue-600 hover:text-blue-800 underline font-bold text-lg">
                        點此進入下一題
                    </button>
                </div>
            </div>
        </div>

        <!-- Result Page -->
        <div id="result-page" class="page bg-white shadow-xl rounded-2xl p-8">
            <h2 class="text-3xl font-bold text-center text-slate-800 mb-8">練習結果</h2>
            
            <div class="text-center mb-10">
                <p id="score-display" class="text-2xl font-bold text-blue-600">您答對了 0 題 / 共 10 題</p>
            </div>

            <div class="overflow-x-auto mb-10">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100">
                            <th class="px-4 py-3 border">題號</th>
                            <th class="px-4 py-3 border">問題</th>
                            <th class="px-4 py-3 border">你的答案</th>
                            <th class="px-4 py-3 border">結果</th>
                            <th class="px-4 py-3 border">備註</th>
                        </tr>
                    </thead>
                    <tbody id="result-table-body">
                        <!-- Results will be injected here -->
                    </tbody>
                </table>
            </div>

            <div class="text-center">
                <button id="restart-btn" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-12 rounded-full text-xl shadow-lg transition-transform active:scale-95">
                    再玩一次
                </button>
            </div>
        </div>

    </div>

    <script>
        const rulesMap = {
            'A': 'いて',
            'B': 'いで',
            'C': 'んで',
            'D': 'って',
            'E': 'て'
        };

        let allVerbs = [];
        let currentQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let userAnswers = [];

        // Elements
        const welcomePage = document.getElementById('welcome-page');
        const questionPage = document.getElementById('question-page');
        const resultPage = document.getElementById('result-page');
        
        const rangeSelect = document.getElementById('range-select');
        const startBtn = document.getElementById('start-btn');
        
        const qCount = document.getElementById('question-count');
        const qVerb = document.getElementById('question-verb');
        const optionsContainer = document.getElementById('options-container');
        const submitBtn = document.getElementById('submit-btn');
        const abortBtn = document.getElementById('abort-btn');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        
        const scoreDisplay = document.getElementById('score-display');
        const resultTableBody = document.getElementById('result-table-body');
        const restartBtn = document.getElementById('restart-btn');

        // Fetch Data
        async function loadData() {
            try {
                const response = await fetch('verbs_data.json');
                allVerbs = await response.json();
            } catch (error) {
                console.error('Error loading verbs data:', error);
                alert('無法讀取 verbs_data.json，請確保檔案存在。');
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function getTeForm(verb, targetCode) {
            const code = targetCode || verb.規則;
            const suffix = rulesMap[code] || '';
            let base = verb.連用形;
            
            // 如果 規則 不等於 "E" 的題目，去掉最後一個字 (除非只有一個字)
            if (verb.規則 !== 'E' && base.length > 1) {
                base = base.slice(0, -1);
            }
            
            return base + suffix;
        }

        function filterVerbs(range) {
            return allVerbs.filter(v => {
                if (v.課本 === '初級1') return true;
                if (v.課本 === '初級2') {
                    const targetLesson = parseInt(range.split('-')[1]);
                    return v.課編號 <= targetLesson;
                }
                return false;
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initQuiz() {
            const pool = filterVerbs(rangeSelect.value);
            if (pool.length < 10) {
                alert('可用單字不足 10 個，請擴大範圍或檢查資料。');
                return;
            }
            
            currentQuestions = shuffle([...pool]).slice(0, 10);
            currentIdx = 0;
            score = 0;
            userAnswers = [];
            
            renderQuestion();
            showPage('question-page');
        }

        function renderQuestion() {
            const verb = currentQuestions[currentIdx];
            qCount.textContent = `第 ${currentIdx + 1} 題 / 共 10 題`;
            qVerb.textContent = verb.ます形;
            
            feedbackArea.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.remove('hidden');
            
            optionsContainer.innerHTML = '';
            ['A', 'B', 'C', 'D', 'E'].forEach(code => {
                const optionText = getTeForm(verb, code);
                const optionId = `opt-${code}`;
                
                const div = document.createElement('div');
                div.className = "relative";
                div.innerHTML = `
                    <input type="radio" name="te-rule" id="${optionId}" value="${code}" class="peer hidden">
                    <label for="${optionId}" class="block p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:bg-blue-50 peer-checked:border-blue-500 peer-checked:bg-blue-50 transition-all font-bold text-xl text-center">
                        ${optionText}
                    </label>
                `;
                optionsContainer.appendChild(div);
                
                div.querySelector('input').addEventListener('change', () => {
                    submitBtn.disabled = false;
                });
            });
        }

        function checkAnswer() {
            const selected = document.querySelector('input[name="te-rule"]:checked');
            if (!selected) return;
            
            const verb = currentQuestions[currentIdx];
            const isCorrect = selected.value === verb.規則;
            const userAnswerText = getTeForm(verb, selected.value);
            const correctAnswerText = getTeForm(verb, verb.規則);

            userAnswers.push({
                verb: verb.ます形,
                user: userAnswerText,
                correct: correctAnswerText,
                isCorrect: isCorrect
            });

            if (isCorrect) score++;

            submitBtn.classList.add('hidden');
            feedbackArea.classList.remove('hidden');
            
            if (isCorrect) {
                feedbackArea.className = "w-full p-6 rounded-xl text-center bg-green-100 text-green-800";
                feedbackText.textContent = "✅ 您答對了！";
            } else {
                feedbackArea.className = "w-full p-6 rounded-xl text-center bg-red-100 text-red-800";
                feedbackText.innerHTML = `❌ 您答錯了，正確答案是：<span class="text-3xl ml-2 font-black">${correctAnswerText}</span>`;
            }
        }

        function showFinalResult() {
            scoreDisplay.textContent = `您答對了 ${score} 題 / 共 10 題`;
            
            resultTableBody.innerHTML = '';
            userAnswers.forEach((ans, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white' : 'bg-slate-50';
                tr.innerHTML = `
                    <td class="px-4 py-3 border text-center">${index + 1}</td>
                    <td class="px-4 py-3 border font-bold">${ans.verb}</td>
                    <td class="px-4 py-3 border">${ans.user}</td>
                    <td class="px-4 py-3 border text-center ${ans.isCorrect ? 'text-green-600' : 'text-red-600'}">${ans.isCorrect ? '〇' : '✖'}</td>
                    <td class="px-4 py-3 border text-sm">${ans.isCorrect ? '' : `<span class="font-bold text-slate-800">${ans.correct}</span>`}</td>
                `;
                resultTableBody.appendChild(tr);
            });
            
            showPage('result-page');
        }

        // Event Listeners
        startBtn.addEventListener('click', initQuiz);
        
        submitBtn.addEventListener('click', checkAnswer);
        
        nextBtn.addEventListener('click', () => {
            currentIdx++;
            if (currentIdx < 10) {
                renderQuestion();
            } else {
                showFinalResult();
            }
        });

        abortBtn.addEventListener('click', () => {
            if (confirm('確定要中止作答並查看目前結果嗎？')) {
                // Fill remaining questions with "Not Answered" if needed, 
                // but usually results show only attempted ones or score out of attempted.
                // Requirement says: "直接顯示結果頁面，顯示到目前為止的答題結果"
                showFinalResult();
            }
        });

        restartBtn.addEventListener('click', () => {
            showPage('welcome-page');
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
